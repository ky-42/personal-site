[package]
name = "server"
version = "1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.15"
actix-cors = "0.7.2"
dotenv = "0.15"
log = "0.4"
env_logger = "0.11"
derive_more = "2.1"
r2d2 = "0.8"
validator = { version = "0.21", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.3", features = ["r2d2", "postgres", "chrono"] }
diesel_migrations = "2.3"

[dev-dependencies]
lipsum = "0.9"
rand = "0.10"
serde_json = "1.0"
actix-http = "3.18"
